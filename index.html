
  <!DOCTYPE html>
  <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Iteration 1 | Young & Hungry</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
        <style>
          :root {
            --obsidian: #050505;
            --acid-green: #D1FF26;
            --deep-gray: #121212;
            --font-body: 'DM Sans', sans-serif;
            --font-heading: 'Bebas Neue', sans-serif;
          }
          
          body {
            background-color: var(--obsidian) !important;
            color: white !important;
            margin: 0;
            font-family: var(--font-body);
            scroll-behavior: smooth;
          }
    
          .bg-obsidian { background-color: var(--obsidian); }
          .bg-deep-gray { background-color: var(--deep-gray); }
          .bg-acid-green { background-color: var(--acid-green); }
          .text-acid-green { color: var(--acid-green); }
          .text-obsidian { color: var(--obsidian); }
          
          .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
          }
    
          .noise-overlay::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
          }
    
          @keyframes slow-pan {
            0%, 100% { transform: scale(1.1) translate(0, 0); }
            50% { transform: scale(1.2) translate(-2%, -2%); }
          }
          .animate-slow-pan { animation: slow-pan 20s ease-in-out infinite; }
    
          @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
          }
          .animate-fade-in-up { animation: fade-in-up 0.8s ease-out forwards; }
    
                .shadow-glow {
    
                  box-shadow: 0 0 20px rgba(209, 255, 38, 0.15), 0 0 40px rgba(209, 255, 38, 0.1);
    
                }
    
                .font-black { font-weight: 900; }
    
              </style>
    
            </head>
    
          
        <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
